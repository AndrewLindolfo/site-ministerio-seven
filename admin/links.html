<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DKM3MTBKQ6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-DKM3MTBKQ6");
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links | Admin Seven</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/animations.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

<header class="admin-topbar">
  <div class="container admin-topbar-inner">
    <a href="./index.html" class="admin-brand" aria-label="Voltar ao painel">
      <img src="../assets/img/v7/icon_120.png" alt="V7" class="admin-v7" />
      <strong>Área de Administração</strong>
    </a>

    <div class="header-actions">
      <button type="button" id="theme-toggle" aria-label="Alternar tema">🌙</button>
      <div class="admin-account">
        <button type="button" id="admin-account-toggle">Conta</button>
        <div id="admin-account-menu" class="admin-account-menu hidden">
          <img id="admin-user-photo" src="../assets/img/v7/icon_120.png" alt="Conta" class="admin-user-photo" />
          <p id="admin-user-email">admin@exemplo.com</p>
          <button type="button" id="admin-logout-button">Sair</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="admin-section-page">
  <section class="container">
    <a href="./index.html" class="admin-back-link">← Voltar ao painel</a>
    <h1>Links</h1>
    
    <form id="admin-links-form" class="admin-form">
      <input type="url" id="link-instagram" maxlength="2000" placeholder="Link do Instagram" aria-label="Link do Instagram" />
      <input type="text" id="arroba-instagram" maxlength="100" placeholder="Arroba do Instagram" aria-label="Arroba do Instagram" />
      <input type="email" id="email-oficial" maxlength="254" placeholder="E-mail oficial" aria-label="E-mail oficial" />
      <textarea id="agenda-embed" maxlength="5000" placeholder="Embed / link da agenda" aria-label="Embed ou link da agenda"></textarea>
      <p id="admin-links-status" class="admin-status" role="status" aria-live="polite"></p>
      <button type="submit" class="button-primary hidden">Salvar links</button>
    </form>

  </section>
</main>

<div id="global-loading" class="global-loading hidden" aria-hidden="true">
  <div class="spinner"></div>
</div>
<script type="module" src="../assets/js/app.js"></script>
<script type="module" src="../assets/js/auth-guard.js"></script>
<script type="module" src="../assets/js/pages/admin-links.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DKM3MTBKQ6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-DKM3MTBKQ6");
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Música | Admin Seven</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/animations.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

<header class="admin-topbar">
  <div class="container admin-topbar-inner">
    <a href="./index.html" class="admin-brand" aria-label="Voltar ao painel">
      <img src="../assets/img/v7/icon_120.png" alt="V7" class="admin-v7" />
      <strong>Área de Administração</strong>
    </a>

    <div class="header-actions">
      <button type="button" id="theme-toggle" aria-label="Alternar tema">🌙</button>
      <div class="admin-account">
        <button type="button" id="admin-account-toggle">Conta</button>
        <div id="admin-account-menu" class="admin-account-menu hidden">
          <img id="admin-user-photo" src="../assets/img/v7/icon_120.png" alt="Conta" class="admin-user-photo" />
          <p id="admin-user-email">admin@exemplo.com</p>
          <button type="button" id="admin-logout-button">Sair</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="admin-section-page">
  <section class="container">
    <a href="./musicas.html" class="admin-back-link">← Voltar para Músicas</a>
    <h1>Editor de Música</h1>

    <form id="admin-editor-musica-form" class="admin-form">
      <input type="text" id="musica-titulo" placeholder="Título *" aria-label="Título" maxlength="150" required />
      <input type="text" id="musica-subtitulo" placeholder="Subtítulo (opcional)" aria-label="Subtítulo" maxlength="200" />
      <input type="text" id="musica-autor" placeholder="Autor / compositor (opcional)" aria-label="Autor ou compositor" maxlength="150" />
      <input type="text" id="musica-tom" placeholder="Tom original (opcional)" aria-label="Tom original" maxlength="20" />
      <input type="text" id="musica-categoria" placeholder="Categoria (opcional)" aria-label="Categoria" maxlength="80" />
      <input type="url" id="musica-youtube" placeholder="Link do YouTube (opcional)" aria-label="Link do YouTube" maxlength="500" />
      <textarea id="musica-observacao" placeholder="Observação interna (opcional)" aria-label="Observação interna" maxlength="5000"></textarea>

      <div class="admin-editor-heading">
        <div>
          <label for="musica-letra">Letra da música</label>
          <small>Formate versos, refrões e destaques sem perder parágrafos ou pontuação.</small>
        </div>
        <span class="admin-editor-state" data-editor-state="musica-letra" role="status" aria-live="polite">Preparando editor…</span>
      </div>
      <textarea id="musica-letra" placeholder="Digite ou cole a letra da música" aria-label="Letra da música"></textarea>

      <p id="admin-editor-musica-status" class="admin-status" role="status" aria-live="polite"></p>

      <div class="admin-form-actions">
        <button type="submit" class="button-primary hidden">Salvar</button>
        <button type="button" id="delete-musica-button" class="button-danger hidden">Excluir</button>
      </div>
    </form>
  </section>
</main>

<div id="global-loading" class="global-loading hidden" aria-hidden="true">
  <div class="spinner"></div>
</div>

<script type="module" src="../assets/js/app.js"></script>

<script type="module" src="../assets/js/auth-guard.js"></script>
<script type="module" src="../assets/js/pages/admin-editor-musica.js"></script>
</body>
</html>
